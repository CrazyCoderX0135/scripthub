<!DOCTYPE html>
<html lang="en" data-theme="dark" data-mode="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScriptHub</title>

  <!-- og:meta (defaults; updated by JS after script loads) -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="ScriptHub" />
  <meta property="og:title"       content="ScriptHub — scripts for everything" />
  <meta property="og:description" content="Browse, copy, and run scripts — no signup, no login, no nonsense." />
  <meta property="og:image"       content="https://crazycoderx0135.github.io/scripthub/og-image.png" />
  <meta property="og:url"         content="https://crazycoderx0135.github.io/scripthub/script.html" />
  <meta name="twitter:card"       content="summary" />
  <meta name="twitter:title"      content="ScriptHub" />
  <meta name="twitter:description" content="Browse, copy, and run scripts — no signup, no login, no nonsense." />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script>
    (function(){
      var t=localStorage.getItem('sh-theme')||'dark';
      var m=localStorage.getItem('sh-mode')||'';
      document.documentElement.setAttribute('data-theme',t);
      document.documentElement.setAttribute('data-mode',m);
    })();
  </script>
</head>
<body>

  <nav>
    <a class="logo" href="index.html">script<span>hub</span>.dev</a>
    <div class="nav-right">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <div class="nav-links">
        <a href="index.html" class="active">browse</a>
        <a href="favorites.html">⭐ favorites</a>
        <a href="generate.html">✨ generate</a>
        <a href="stats.html">📊 stats</a>
        <a href="submit.html">submit</a>
        <div class="more-menu" id="more-menu">
          <button class="more-trigger" id="more-trigger">explore ▾</button>
          <div class="more-dropdown">
          <a href="beginner.html">🔰 beginner</a>
          <a href="leaderboard.html">🏆 top scripts</a>
          <a href="collections.html">📦 collections</a>
          <hr>
          <a href="about.html">about</a>
          <a href="changelog.html">changelog</a>
          <a href="request.html">request a script</a>
          </div>
        </div>
      </div>
      <button class="nav-btn" onclick="goRandom()">🎲 random</button>
      <button class="terminal-btn" id="terminal-btn" onclick="toggleTerminal()">💻</button>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>
  </nav>

  <div class="detail-wrap" id="detail">
    <p style="color:var(--muted)">loading...</p>
  </div>

  <!-- REPORT BUG MODAL -->
  <div class="modal-overlay" id="bug-modal" onclick="if(event.target===this)closeBug()">
    <div class="modal">
      <button class="modal-close" onclick="closeBug()">✕</button>
      <h2>report a <span class="red">bug</span></h2>
      <p class="subtitle">something not working? let us know.</p>
      <div id="bug-form">
        <div class="form-group">
          <label>what went wrong?</label>
          <textarea id="bug-desc" style="min-height:120px;" placeholder="describe the problem..."></textarea>
        </div>
        <div class="form-group">
          <label>your OS</label>
          <select id="bug-os"><option>Windows</option><option>Mac</option><option>Linux</option></select>
        </div>
        <button class="submit-btn" onclick="submitBug()">send report →</button>
      </div>
      <div id="bug-thanks" style="display:none;color:var(--green);font-size:0.88rem;">✓ thanks for the report! we'll look into it.</div>
    </div>
  </div>

  <button id="back-top">↑ top</button>

  <footer><p>scripthub &nbsp;·&nbsp; <a href="about.html">about</a> &nbsp;·&nbsp; <a href="changelog.html">changelog</a></p></footer>

  <script src="scripts.js"></script>
  <script src="meta.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    // ── THEME & NAV ───────────────────────────────────────────
    function toggleTheme() {
      document.documentElement.classList.add('theme-transitioning');
      const curr = document.documentElement.getAttribute('data-theme');
      const next = curr==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sh-theme', next);
      document.getElementById('theme-btn').textContent = next==='dark'?'🌙':'☀️';
      setTimeout(() => document.documentElement.classList.remove('theme-transitioning'), 420);
    }
    function toggleTerminal() {
      const curr = document.documentElement.getAttribute('data-mode');
      const next = curr==='terminal'?'':'terminal';
      document.documentElement.setAttribute('data-mode', next);
      localStorage.setItem('sh-mode', next);
      document.getElementById('terminal-btn').classList.toggle('active', next==='terminal');
    }
    document.getElementById('theme-btn').textContent = (localStorage.getItem('sh-theme')||'dark')==='dark'?'🌙':'☀️';
    document.getElementById('terminal-btn').classList.toggle('active', (localStorage.getItem('sh-mode')||'')==='terminal');

    function goRandom() {
      const s = SCRIPTS[Math.floor(Math.random()*SCRIPTS.length)];
      window.location.href = `script.html?id=${s.id}`;
    }

    // Back to top
    const bt = document.getElementById('back-top');
    if (bt) {
      window.addEventListener('scroll', () => bt.classList.toggle('visible', window.scrollY>400));
      bt.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));
    }

    // Hamburger
    const hamburger = document.getElementById('hamburger');
    const navLinks  = document.querySelector('.nav-links');
    if (hamburger && navLinks) {
      hamburger.addEventListener('click', () => navLinks.classList.toggle('open'));
      navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));
      document.addEventListener('click', e => {
        if (!hamburger.contains(e.target) && !navLinks.contains(e.target)) navLinks.classList.remove('open');
      }

    // ── MORE DROPDOWN ─────────────────────────────────────────
    (function() {
      const menu = document.getElementById('more-menu');
      const trigger = document.getElementById('more-trigger');
      if (!menu || !trigger) return;
      trigger.addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
      document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.classList.remove('open'); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') menu.classList.remove('open'); });
    })(););
    }

    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ── DOWNLOAD ──────────────────────────────────────────────
    function downloadScript(filename, content) {
      const blob = new Blob([content], {type:'text/plain'});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ── RECENTLY VIEWED ───────────────────────────────────────
    function trackRecentlyViewed(id) {
      try {
        let rv = JSON.parse(localStorage.getItem('sh-rv') || '[]');
        rv = rv.filter(x => x !== id);
        rv.unshift(id);
        rv = rv.slice(0, 8);
        localStorage.setItem('sh-rv', JSON.stringify(rv));
      } catch(e) {}
    }

    // ── FAVORITES ─────────────────────────────────────────────
    function getFavs() {
      try { return JSON.parse(localStorage.getItem('sh-favs') || '[]'); } catch { return []; }
    }
    function toggleFav(id) {
      let favs = getFavs();
      if (favs.includes(id)) {
        favs = favs.filter(x => x !== id);
      } else {
        favs.unshift(id);
      }
      localStorage.setItem('sh-favs', JSON.stringify(favs));
      return favs.includes(id);
    }

    // ── TERMINAL DEMO BUILDER ─────────────────────────────────
    function buildTermDemo(meta, script) {
      if (!meta.demo || meta.demo.length === 0) return '';
      return `
        <div class="term-demo" id="term-demo">
          <div class="term-demo-bar">
            <div class="term-dots"><span></span><span></span><span></span></div>
            <span class="term-demo-title">▶ demo</span>
            <button class="term-replay-btn" id="term-replay-btn" onclick="replayDemo()">↺ replay</button>
          </div>
          <div class="term-demo-body" id="term-demo-body"></div>
        </div>`;
    }

    function runTermDemo() {
      const body = document.getElementById('term-demo-body');
      if (!body) return;
      const meta = (SCRIPT_META&&SCRIPT_META[script.id])||{};
      const demo = meta.demo || [];
      body.innerHTML = '';
      let lineIndex = 0;

      function nextLine() {
        if (lineIndex >= demo.length) {
          const cur = document.createElement('span');
          cur.className = 'term-cursor';
          cur.textContent = '█';
          body.appendChild(cur);
          return;
        }
        const item = demo[lineIndex++];
        const row = document.createElement('div');
        row.className = 'term-line';

        if (item.t === 'cmd') {
          row.innerHTML = '<span class="term-prompt">$ </span><span class="term-cmd"></span>';
          body.appendChild(row);
          typeText(row.querySelector('.term-cmd'), item.v, 38, () => {
            setTimeout(nextLine, 180);
          });
        } else if (item.t === 'in') {
          row.innerHTML = `<span class="term-input">${escHtml(item.v)}</span>`;
          body.appendChild(row);
          setTimeout(nextLine, 220);
        } else {
          row.innerHTML = `<span class="term-output">${escHtml(item.v)}</span>`;
          body.appendChild(row);
          setTimeout(nextLine, item.v === '' ? 80 : 160);
        }
        body.scrollTop = body.scrollHeight;
      }

      function typeText(el, text, speed, done) {
        let i = 0;
        function tick() {
          if (i >= text.length) { done && done(); return; }
          el.textContent += text[i++];
          setTimeout(tick, speed + Math.random() * 20);
        }
        tick();
      }

      setTimeout(nextLine, 300);
    }

    function replayDemo() { runTermDemo(); }

    const langMap   = {python:'python',javascript:'javascript',shell:'bash',powershell:'powershell'};
    const langBadge = {python:'badge-py',javascript:'badge-js',shell:'badge-sh',powershell:'badge-ps'};

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const script = SCRIPTS.find(s=>s.id===id);
    const detail = document.getElementById('detail');

    if (!script) {
      detail.innerHTML = `<p style="color:var(--muted)">Script not found. <a href="index.html" style="color:var(--blue)">go back</a></p>`;
    } else {
      // Update page title
      document.title = `${script.name} — ScriptHub`;

      // Update og:meta tags
      document.querySelector('meta[property="og:title"]').setAttribute('content', `${script.name} — ScriptHub`);
      document.querySelector('meta[property="og:description"]').setAttribute('content', script.desc);
      document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', `${script.name} — ScriptHub`);
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', script.desc);

      // Track recently viewed
      trackRecentlyViewed(script.id);

      const meta     = (SCRIPT_META&&SCRIPT_META[script.id])||{difficulty:'beginner',requires:[],version:'1.0'};
      const likeKey  = `sh-likes-${script.id}`;
      const likedKey = `sh-liked-${script.id}`;
      const likes    = parseInt(localStorage.getItem(likeKey)||'0');
      const liked    = localStorage.getItem(likedKey)==='1';
      const favs     = getFavs();
      const isFav    = favs.includes(script.id);
      const ext      = script.lang==='python'?'py':script.lang==='javascript'?'js':script.lang==='powershell'?'ps1':'sh';
      const filename = `${script.id}.${ext}`;

      const reqHtml = meta.requires&&meta.requires.length>0
        ? `<div class="requires-box"><b>requires:</b> install before running: ${meta.requires.map(r=>`<code>pip install ${r}</code>`).join('  ')}</div>`
        : '';

      // Similar scripts (same tag, different id, up to 3)
      const similar = SCRIPTS.filter(s=>s.tag===script.tag&&s.id!==script.id).slice(0,3);
      const simHtml = similar.length>0 ? `
        <div class="similar-section">
          <div class="section-label" style="margin-bottom:0.6rem;">similar scripts</div>
          <div class="similar-grid">
            ${similar.map(s=>`
              <a class="card" href="script.html?id=${s.id}" style="text-decoration:none;">
                <div class="card-top"><span class="card-icon">${s.icon}</span><span class="card-name">${s.name}</span></div>
                <div class="card-desc">${s.desc}</div>
              </a>`).join('')}
          </div>
        </div>` : '';

      detail.innerHTML = `
        <a class="back-link" href="index.html">← back to browse</a>
        <div class="detail-header">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:0.5rem;">
            <span style="font-size:2rem;">${script.icon}</span>
            <h1 class="detail-title">${script.name}</h1>
          </div>
          <p class="detail-desc">${script.desc}</p>
          <div class="detail-meta">
            <span class="badge ${langBadge[script.lang]||'badge-py'}">${script.lang}</span>
            <span class="badge" style="color:var(--muted);border-color:var(--border);background:transparent;">${script.tag}</span>
            <span class="badge diff-${meta.difficulty}">${meta.difficulty}</span>
            <span class="badge badge-ver">v${meta.version||'1.0'}</span>
          </div>
        </div>

        ${reqHtml}

        <div class="rating-box">
          <span>was this useful?</span>
          <button class="like-btn ${liked?'liked':''}" id="like-btn">♥ <span id="like-count">${likes}</span> likes</button>
          <button class="star-btn ${isFav?'starred':''}" id="star-btn">${isFav?'★ saved':'☆ save'}</button>
          <button class="link-btn" id="link-btn" style="margin-left:auto;">🔗 copy link</button>
          <button class="print-btn" onclick="window.print()">🖨 print</button>
          <button class="bug-btn" onclick="openBug()">🐛 bug?</button>
        </div>

        <div class="code-block">
          <div class="code-toolbar">
            <span class="code-lang">${script.lang}</span>
            <div class="code-toolbar-right">
              <button class="dl-btn" id="dl-btn">⬇ download</button>
              <button class="copy-btn" id="copy-btn">copy code</button>
            </div>
          </div>
          <pre><code class="language-${langMap[script.lang]||'python'}" id="code-el">${escHtml(script.code)}</code></pre>
        </div>

        <div class="usage-tip" style="margin-bottom:1.5rem;">
          <b>how to use:</b> copy the code, save it as <code style="color:var(--blue)">${filename}</code>, then run it from your terminal.
          <a href="index.html#guide" onclick="localStorage.setItem('open-guide','1')" style="color:var(--blue);">need help? see the guide →</a>
        </div>

        ${buildTermDemo(meta, script)}

        ${simHtml}

        <div class="comments-section">
          <h3>💬 comments</h3>
          <script src="https://utteranc.es/client.js"
            repo="crazycoderx0135/scripthub"
            issue-term="og:title"
            theme="github-dark"
            crossorigin="anonymous"
            async>
          <\/script>
        </div>
      `;

      // Syntax highlight
      document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

      // Run terminal demo
      runTermDemo();

      // Copy code
      document.getElementById('copy-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(script.code).then(() => {
          const btn = document.getElementById('copy-btn');
          btn.textContent='copied!'; btn.classList.add('copied');
          setTimeout(()=>{btn.textContent='copy code';btn.classList.remove('copied');},2000);
        });
      });

      // Download
      document.getElementById('dl-btn').addEventListener('click', () => {
        downloadScript(filename, script.code);
        const btn = document.getElementById('dl-btn');
        btn.textContent='✓ saved!';
        setTimeout(()=>btn.textContent='⬇ download',2000);
      });

      // Copy link
      document.getElementById('link-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          const btn = document.getElementById('link-btn');
          btn.textContent='✓ copied!';
          setTimeout(()=>btn.textContent='🔗 copy link',2000);
        });
      });

      // Like
      document.getElementById('like-btn').addEventListener('click', () => {
        const btn = document.getElementById('like-btn');
        const cnt = document.getElementById('like-count');
        if (btn.classList.contains('liked')) {
          const n = Math.max(0,parseInt(cnt.textContent)-1);
          cnt.textContent=n; localStorage.setItem(likeKey,n); localStorage.removeItem(likedKey); btn.classList.remove('liked');
        } else {
          const n = parseInt(cnt.textContent)+1;
          cnt.textContent=n; localStorage.setItem(likeKey,n); localStorage.setItem(likedKey,'1'); btn.classList.add('liked');
        }
      });

      // Star / favorites
      document.getElementById('star-btn').addEventListener('click', () => {
        const btn = document.getElementById('star-btn');
        const nowFav = toggleFav(script.id);
        btn.textContent = nowFav ? '★ saved' : '☆ save';
        btn.classList.toggle('starred', nowFav);
        if (nowFav) {
          const toast = document.createElement('div');
          toast.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--yellow);color:var(--yellow);padding:0.6rem 1.5rem;border-radius:8px;font-size:0.82rem;font-family:Courier New,monospace;z-index:9999;transition:opacity 0.5s;';
          toast.textContent = '⭐ added to favorites';
          document.body.appendChild(toast);
          setTimeout(() => { toast.style.opacity='0'; setTimeout(()=>toast.remove(),500); }, 2000);
        }
      });
    }

    // Bug modal
    function openBug()  { document.getElementById('bug-modal').classList.add('open'); document.body.style.overflow='hidden'; }
    function closeBug() { document.getElementById('bug-modal').classList.remove('open'); document.body.style.overflow=''; }
    function submitBug() {
      const desc = document.getElementById('bug-desc').value.trim();
      if (!desc) { alert('please describe the bug.'); return; }
      document.getElementById('bug-form').style.display='none';
      document.getElementById('bug-thanks').style.display='block';
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      const tag = document.activeElement?.tagName;
      const isTyping = tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
      if (isTyping) return;
      if (e.key==='Escape') { closeBug(); return; }
      if (e.key==='r'||e.key==='R') { goRandom(); return; }
    });
  </script>
</body>
</html>
