<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit a Script — ScriptHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <a class="logo" href="index.html">script<span>hub</span>.dev</a>
    <div class="nav-links">
      <a href="index.html">browse</a>
      <a href="submit.html">submit</a>
    </div>
  </nav>

  <div class="submit-wrap">
    <a class="back-link" href="index.html">← back to browse</a>
    <h1>submit a <span class="green">script</span></h1>
    <p>share a script you built. once reviewed it'll show up on the site.</p>

    <div id="form-wrap">
      <div class="form-group">
        <label for="s-name">script name</label>
        <input type="text" id="s-name" placeholder="e.g. bulk-rename" />
      </div>

      <div class="form-group">
        <label for="s-desc">description</label>
        <input type="text" id="s-desc" placeholder="what does it do? (one sentence)" />
      </div>

      <div class="form-group">
        <label for="s-lang">language</label>
        <select id="s-lang">
          <option value="python">python</option>
          <option value="javascript">javascript</option>
          <option value="shell">shell</option>
          <option value="powershell">powershell</option>
        </select>
      </div>

      <div class="form-group">
        <label for="s-tag">category</label>
        <select id="s-tag">
          <option value="automation">automation</option>
          <option value="utilities">utilities</option>
          <option value="web">web</option>
          <option value="file tools">file tools</option>
          <option value="games">games</option>
        </select>
      </div>

      <div class="form-group">
        <label for="s-code">paste your code</label>
        <textarea id="s-code" placeholder="# paste your script here..."></textarea>
      </div>

      <button class="submit-btn" id="submit-btn">submit script →</button>
    </div>

    <div id="success-msg" style="display:none; margin-top:2rem; padding:1.25rem; background:#0d2110; border:1px solid #1a3a1f; border-radius:8px;">
      <p style="color:#3fb950; margin-bottom:0.4rem;">✓ script submitted!</p>
      <p style="color:#8b949e; font-size:0.85rem;">thanks for contributing. submissions are reviewed before going live.</p>
    </div>
  </div>

  <footer>
    <p>scripthub &mdash; scripts for everything</p>
  </footer>

  <script>
    const BAD_WORDS = [
      "fuck","shit","ass","bitch","cunt","dick","cock","pussy","bastard","damn",
      "asshole","motherfucker","faggot","nigger","nigga","whore","slut","retard",
      "piss","crap","bollocks","wanker","twat","prick","arse","dumbass","jackass",
      "dipshit","shithead","bullshit","douchebag","fucker","fuckhead","moron",
      "idiot","stupid","hate","kill","murder","rape","porn","sex","nude","naked",
      "xxx","hentai","drugs","weed","cocaine","meth","heroin","hack","exploit",
      "cheat","bypass","crack","malware","virus","ddos","keylogger","phish"
    ];

    const ERROR_STYLES = `
      border-color: #993535 !important;
      background: #1a0d0d !important;
    `;

    function containsBadWord(text) {
      const lower = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
      return BAD_WORDS.some(word => {
        const regex = new RegExp(`\\b${word}\\b`, 'i');
        return regex.test(lower);
      });
    }

    function showError(inputId, msg) {
      const el = document.getElementById(inputId);
      el.style.cssText += ERROR_STYLES;
      let err = el.parentElement.querySelector('.field-error');
      if (!err) {
        err = document.createElement('p');
        err.className = 'field-error';
        err.style.cssText = 'color:#ff6b6b;font-size:0.8rem;margin-top:5px;';
        el.parentElement.appendChild(err);
      }
      err.textContent = msg;
    }

    function clearErrors() {
      document.querySelectorAll('.field-error').forEach(e => e.remove());
      ['s-name','s-desc','s-code'].forEach(id => {
        const el = document.getElementById(id);
        el.style.borderColor = '';
        el.style.background = '';
      });
    }

    document.getElementById("submit-btn").addEventListener("click", () => {
      clearErrors();

      const name = document.getElementById("s-name").value.trim();
      const desc = document.getElementById("s-desc").value.trim();
      const code = document.getElementById("s-code").value.trim();

      let hasError = false;

      if (!name) {
        showError("s-name", "please enter a script name.");
        hasError = true;
      } else if (containsBadWord(name)) {
        showError("s-name", "script name contains inappropriate content.");
        hasError = true;
      }

      if (!desc) {
        showError("s-desc", "please enter a description.");
        hasError = true;
      } else if (containsBadWord(desc)) {
        showError("s-desc", "description contains inappropriate content.");
        hasError = true;
      }

      if (!code) {
        showError("s-code", "please paste your script code.");
        hasError = true;
      } else if (containsBadWord(code)) {
        showError("s-code", "script contains inappropriate content or flagged keywords.");
        hasError = true;
      }

      if (hasError) return;

      document.getElementById("form-wrap").style.display = "none";
      document.getElementById("success-msg").style.display = "block";
    });
  </script>
</body>
</html>
